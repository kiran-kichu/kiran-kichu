<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="Worst-case IR drop for three power grid configurations">
<style>.h{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.l{font:13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}.v{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3}.f{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}</style>
<rect width="760" height="200" fill="#0d1117"/>
<text x="20" y="28" class="h">Same PicoRV32 layout, three power grids: worst-case IR drop (OpenROAD, measured)</text>
<text x="20" y="67" class="l">Sparse grid (1.6 µm, 2× pitch)</text><rect x="250" y="50" width="349.3" height="24" rx="4" fill="#30363d"><animate attributeName="width" from="0" to="349.3" dur="1.2s" fill="freeze"/></rect><text x="607.3" y="67" class="v">78.6 mV · 4.37%</text><text x="20" y="111" class="l">Default grid (1.6 µm)</text><rect x="250" y="94" width="149.8" height="24" rx="4" fill="#30363d"><animate attributeName="width" from="0" to="149.8" dur="1.2s" fill="freeze"/></rect><text x="407.8" y="111" class="v">33.7 mV · 1.87%</text><text x="20" y="155" class="l">Wider straps (3.2 µm)</text><rect x="250" y="138" width="68.0" height="24" rx="4" fill="#f0883e"><animate attributeName="width" from="0" to="68.0" dur="1.2s" fill="freeze"/></rect><text x="326.0" y="155" class="v">15.3 mV · 0.85%</text>
<text x="20" y="188" class="f">Doubling strap width halved the drop, as resistance scaling predicts. 1.6 µm is Sky130's minimum met5 width.</text>
</svg>